root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/service-core.exe ./cmd/server"
  bin = "./tmp/service-core.exe"
  include_ext = ["go", "tpl", "tmpl", "html", "env"]
  exclude_dir = ["tmp", "vendor", ".git"]
  delay = 250
  stop_on_error = true

[log]
  time = true

[color]
  main = "cyan"
  watcher = "yellow"
  build = "green"
  runner = "magenta"

[misc]
  clean_on_exit = true
