version: '3.9'

services:
  mysql:
    image: mysql:8.4
    container_name: fifam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fifam_dev}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: fifam-redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  service-core:
    image: golang:1.24
    container_name: fifam-service-core
    working_dir: /app/apps/service-core
    command: sh -c "go run ./cmd/server"
    volumes:
      - ../../:/app
    environment:
      SERVICE_CORE_PORT: 8081
      MYSQL_DSN: root:1234@tcp(mysql:3306)/fifam_dev?parseTime=true
    ports:
      - '8081:8081'
    depends_on:
      - mysql

  web:
    image: node:24-alpine
    container_name: fifam-web
    working_dir: /app/apps/web
    command: sh -c "npm install && npm run dev -- --host"
    volumes:
      - ../../:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8081
      VITE_WS_URL: ws://localhost:8081/ws
    ports:
      - '5173:5173'
    depends_on:
      - service-core

volumes:
  mysql_data:
