name: fifam

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["mysqld", "--bind-address=0.0.0.0"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fifam_dev}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../../apps/server
      dockerfile: Dockerfile
    image: fifam-backend:node22-alpine
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST_PORT: "3001"
      FRONTEND_URL: ${FRONTEND_URL:-https://football.b4f.site}
      BACKEND_URL: ${BACKEND_URL:-https://apifootball.b4f.site}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fifam_dev}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
      DB_DROP_UNMAPPED_TABLES: ${DB_DROP_UNMAPPED_TABLES:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-fifam-dev-secret}
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://apifootball.b4f.site}
        VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-https://apifootball.b4f.site}
        VITE_SOCKET_PATH: ${VITE_SOCKET_PATH:-/socket.io}
    image: fifam-frontend:node22-alpine
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  backend_uploads:
